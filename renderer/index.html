<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:;">
  <title>Marginalia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="titlebar"></div>

  <main id="viewer">
    <div id="empty">
      <div class="empty-card">
        <h1>Marginalia</h1>
        <p>Notes in the margins. Your PDF is the canvas — draw on it, write on it, paste onto it.</p>
        <button id="openBtn2" class="primary big">Open a PDF…</button>
        <ul class="hints">
          <li>Pick a tool from the bar at the top and draw on the page</li>
          <li><b>⌘V</b> pastes whatever is on your clipboard</li>
          <li><b>⌘Z</b> undoes · it saves itself as you go</li>
        </ul>
      </div>
    </div>
    <div id="pages"></div>
  </main>

  <!-- floating islands -->
  <div id="titleIsland" class="island hidden">
    <input id="docName" type="text" spellcheck="false"
           title="Click to rename this PDF" aria-label="Document name">
    <span class="ext">.pdf</span>
  </div>

  <div id="toolbar" class="island">
    <div class="tools" id="tools"></div>
  </div>

  <div id="panel" class="island hidden">
    <div class="panel-group">
      <label class="panel-label">Colour</label>
      <div class="swatches" id="colors"></div>
    </div>
    <div class="panel-group" id="strokeGroup">
      <label class="panel-label">Stroke width</label>
      <div class="segmented" id="strokeWidths"></div>
    </div>
    <div class="panel-group" id="fontGroup">
      <label class="panel-label">Font size</label>
      <div class="segmented" id="fontSizes"></div>
    </div>
  </div>

  <div id="fileIsland" class="island">
    <button id="themeBtn" title="Light / dark">
      <svg class="moon" viewBox="0 0 17 17"><path d="M14 10.4A6 6 0 116.6 3a4.8 4.8 0 007.4 7.4z"/></svg>
      <svg class="sun" viewBox="0 0 17 17"><circle cx="8.5" cy="8.5" r="3.2"/><path d="M8.5 1v2M8.5 14v2M1 8.5h2M14 8.5h2M3.2 3.2l1.4 1.4M12.4 12.4l1.4 1.4M13.8 3.2l-1.4 1.4M4.6 12.4l-1.4 1.4"/></svg>
    </button>
    <button id="undoBtn" title="Undo (⌘Z)">
      <svg viewBox="0 0 17 17"><path d="M6 4.5L3 7.5l3 3"/><path d="M3 7.5h6.5a3.8 3.8 0 010 7.6H6.5"/></svg>
    </button>
    <button id="redoBtn" title="Redo (⇧⌘Z)">
      <svg viewBox="0 0 17 17"><path d="M11 4.5l3 3-3 3"/><path d="M14 7.5H7.5a3.8 3.8 0 000 7.6h3"/></svg>
    </button>
    <button id="openBtn" class="ghost" title="Open (⌘O)">Open</button>
  </div>

  <div id="zoomIsland" class="island">
    <button data-zoom="-1" title="Zoom out (⌘−)">&minus;</button>
    <button id="zoomLabel" data-fit="fit" title="Fit page (⌘0)">Fit</button>
    <button data-zoom="1" title="Zoom in (⌘+)">+</button>
  </div>

  <footer id="status"><span id="statusText">No document open</span></footer>
  <div id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
